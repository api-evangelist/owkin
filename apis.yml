aid: owkin
name: OWKIN
description: 'Owkin is a French-American AI-biotech company (offices in New York, Paris, and London)
  that builds K Pro, an agentic "AI biology" platform for pharmaceutical and biotech R&D. K Pro pairs
  large-language-model agents with Owkin''s multimodal patient-data network — spanning 164 academic
  institutions, the MOSAIC spatial-omics dataset, and public sources such as TCGA and PubMed — to help
  scientists identify drug targets, prioritize indications, explore cohorts, review literature, and
  navigate clinical trials. Owkin is also known for open-source federated-learning and computational-
  pathology research (FLamby, PyDESeq2, HistoSSLscaling). The company is backed by GV (Google Ventures).
  Owkin exposes product documentation and an agentic app (K Pro) but no public developer/REST API.'
